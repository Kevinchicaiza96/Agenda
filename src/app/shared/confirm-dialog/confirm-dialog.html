<div class="confirm-container">

  <div class="confirm-icon" [class.danger]="data.type === 'danger'"
                            [class.warning]="data.type === 'warning'">
    <mat-icon>{{ data.type === 'danger' ? 'delete_outline' : 'warning_amber' }}</mat-icon>
  </div>

  <h2 class="confirm-title">{{ data.title }}</h2>
  <p class="confirm-message">{{ data.message }}</p>

  <div class="confirm-actions">
    <button mat-stroked-button (click)="cancel()">Cancelar</button>
    <button mat-flat-button
            [class.btn-danger]="data.type === 'danger'"
            [class.btn-warning]="data.type === 'warning'"
            (click)="confirm()">
      {{ data.confirm }}
    </button>
  </div>

</div>
